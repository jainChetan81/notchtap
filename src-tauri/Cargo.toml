[package]
name = "notchtap"
version = "0.1.0"
description = "macOS notch/hud notification overlay"
authors = ["chetanjain"]
edition = "2021"

[lib]
name = "notchtap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Plan 138 (v7 ticket 6 of 13, `docs/V7_AGENT_INTEGRATIONS_TECHNICAL_SPEC.md`
# §4.1): the shared hook-delivery binary installed alongside the app. Kept
# thin on purpose — its logic lives in `agents::providers` (this crate's
# lib target), so this is just an entry point + argv dispatch.
[[bin]]
name = "notchtap-agent"
path = "src/bin/notchtap_agent.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# plan 083 workstream a: `protocol-asset` enables tauri's asset protocol
# (route (i) for serving cached crest PNGs to the webview) — required by
# tauri.conf.json's `app.security.assetProtocol.enable`.
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-appender = "0.2.5"
thiserror = "2.0.18"
anyhow = "1.0.103"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
toml = "1.1.3"
dirs = "6.0.0"
uuid = { version = "1.24.0", features = ["v4"] }
axum = "0.8.9"
# plan 104: "process" + "io-util" added for now_playing.rs's supervised
# streaming child (tokio::process::Command + AsyncBufReadExt::lines over
# its piped stdout) — no other module in this crate spawns a long-lived
# child, so neither feature was needed before this.
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "time", "net", "sync", "process", "io-util"] }
smappservice-rs = "0.1"
reqwest = { version = "0.13.4", features = ["json", "gzip"] }
chrono = "0.4"
feed-rs = "2"
# About section (get_about_info, settings.rs/about.rs): process + system
# memory and root-disk stats. Targeted refresh only (memory + current
# process, not System::new_all()'s full sweep) — see about.rs's own doc
# comment.
sysinfo = "0.32"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-global-shortcut = "2.3.2"
objc2-app-kit = { version = "0.3.2", features = ["NSWindow"] }
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "a3122e894383aa068ec5365a42994e3ac94ba1b6" }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "test"] }
wiremock = "0.6"
proptest = "1"
